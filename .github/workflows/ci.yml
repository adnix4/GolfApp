# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/ci.yml — Continuous Integration
# ─────────────────────────────────────────────────────────────────────────────
#
# WHEN THIS RUNS:
#   • On every pull_request targeting the main branch
#   • On every push directly to main (catches direct commits)
#
# WHAT IT DOES:
#   Runs four Turborepo tasks across ALL workspaces in parallel:
#     1. turbo lint       — ESLint across all TypeScript workspaces
#     2. turbo type-check — tsc --noEmit across all TypeScript workspaces
#     3. turbo test       — vitest run in every workspace that has tests
#                           (admin, mobile, shared-types, theme)
#     4. dotnet build     — C# compilation check + xUnit tests for apps/api
#   The all-checks-passed job at the bottom aggregates every job into one
#   status, so branch protection only has to require that single check.
#   NOTE: main is NOT currently protected, so nothing here actually blocks a
#   merge yet — these are advisory until required checks are configured in
#   GitHub → Settings → Branches.
#
# WHY TURBOREPO IN CI:
#   Turborepo's remote cache (Vercel Remote Cache) means unchanged workspaces
#   are skipped entirely.  If only apps/web changed, packages/* and apps/api
#   lint results are restored from cache in ~2 seconds instead of re-running.
#   This keeps CI fast as the monorepo grows.
#
# SECRETS REQUIRED (set in GitHub → Settings → Secrets → Actions):
#   TURBO_TOKEN    — Vercel Remote Cache token (optional but speeds up CI)
#   TURBO_TEAM     — Vercel team slug (optional, used with TURBO_TOKEN)
#
# ─────────────────────────────────────────────────────────────────────────────

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same PR.
# Prevents wasting CI minutes on outdated commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── TYPESCRIPT WORKSPACES ─────────────────────────────────────────────────
  typescript-checks:
    name: Lint, Type-Check & Test (TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 gives Turborepo the full git history so it can
          # accurately determine which files changed for cache invalidation.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 20 LTS — required by Metro bundler (spec Foundation §8)
          node-version: '24'
          # Cache npm dependencies keyed to package-lock.json hash.
          # On cache hit, `npm ci` restores from cache instead of downloading.
          cache: 'npm'

      - name: Install dependencies
        # --legacy-peer-deps: react-native-web 0.21 declares react@^18 peer dep
        # but expo SDK 55 runs on react@19. Flag silences the conflict without
        # downgrading either package.
        run: npm ci --legacy-peer-deps

      - name: Run ESLint across all workspaces
        # `turbo run lint` fans out to every workspace that has a "lint" script.
        # Results are cached — unchanged workspaces are skipped.
        run: npm run lint
        env:
          # Turborepo remote cache credentials (optional — CI still works without them)
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM:  ${{ secrets.TURBO_TEAM }}

      - name: Run TypeScript type-check across all workspaces
        # `turbo run type-check` runs `tsc --noEmit` in every TypeScript workspace.
        # Packages are type-checked before the apps that depend on them.
        run: npm run type-check
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM:  ${{ secrets.TURBO_TEAM }}

      - name: Run unit tests across all workspaces
        # `turbo run test` fans out to vitest in admin, mobile, shared-types and
        # theme (apps/web and packages/ui have no test script yet). These ran
        # only locally before, so a vitest regression could reach main green.
        run: npm test
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM:  ${{ secrets.TURBO_TEAM }}

  # ── .NET API ──────────────────────────────────────────────────────────────
  dotnet-build:
    name: Build & Verify (ASP.NET Core)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          # Pinned to .NET 8 — matches the TargetFramework in apps/api/WebAPI.csproj
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        # `dotnet restore` on the solution restores both the API and test projects.
        run: dotnet restore GolfApp.sln

      - name: Build API (Release configuration)
        # Build the full solution so the test project is also compiled.
        run: dotnet build GolfApp.sln --no-restore -c Release

      - name: Run API unit tests (with coverage)
        # Runs xUnit tests in apps/api-tests against the in-memory database.
        # coverlet.collector is already a test dependency; this turns it on.
        run: >
          dotnet test GolfApp.sln --no-build -c Release --verbosity normal
          --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Coverage summary (informational, never fails)
        # Per-area table on the run's summary page. EF migrations are excluded
        # from the total: generated, large, and never exercised by unit tests
        # (problemList T11).
        if: always()
        run: |
          report=$(find ./coverage -name coverage.cobertura.xml | head -1)
          node scripts/coverage-summary.js "$report" --markdown >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: ./coverage/**/coverage.cobertura.xml
          if-no-files-found: ignore

  # ── DEPENDENCY AUDIT ──────────────────────────────────────────────────────
  # Surfaces vulnerable dependencies on every PR/push. Fails ONLY on high or
  # critical severity in PRODUCTION deps (--omit=dev) so the existing dev/test
  # tooling vulns (vitest/vite) and the Expo build-tool moderates — none of which
  # ship in the API or app runtime, and can't be fixed without major upgrades —
  # are reported but don't block. Runs against the committed lockfile; no install.
  #
  # The gate is scripts/audit-prod.js rather than a bare `npm audit` because the
  # same "doesn't ship in the API or app runtime" reasoning above eventually
  # applies to a HIGH as well — image-size reaches us only through the Metro
  # bundler and has no fixed version to move to. Dropping the threshold to
  # `critical` would have hidden real highs (the js-yaml and nanoid ones fixed on
  # 2026-08-14), so instead each accepted high is named in .audit-allowlist.json
  # with a reason and an expiry date. The script fails on anything unlisted, on
  # an entry past its reviewBy, and on an entry that has stopped matching.
  web-bundles:
    # Nothing else in CI runs Metro: lint/type-check/vitest pass on code that
    # cannot bundle (an unresolvable import, a bad metro.config.js). Admin's
    # export used to run only at deploy time, after merge, and mobile's never
    # ran at all, which is how the wa-sqlite.wasm resolve failure went unseen
    # until #97 (problemList T5). Runs `npm run build` directly, not through
    # turbo, so a cache hit can never replay an old green bundle.
    name: Web Bundle (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin, mobile]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Export web bundle (expo export --platform web)
        run: npm run build -w @gfp/${{ matrix.app }}

  e2e:
    # The only job that runs the API against real Postgres + Redis: migrations
    # from zero, SELECT … FOR UPDATE, query translation, join cost, rate limits,
    # plus the browser UI smoke. Every API unit test is EF InMemory, which has
    # none of that (problemList T7). Lint/type-check/tests run in their own
    # jobs, so the harness skips its gates here (--skip-gates).
    name: End-to-End (harness)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Placeholder secrets (same as a fresh local checkout)
        # The API refuses to start without JWT_SECRET etc. .env.example holds
        # non-secret placeholders; the harness's own DATABASE_URL / REDIS_URL
        # win over the file (real env beats .env.local).
        run: cp .env.example .env.local

      - name: Run the e2e harness
        run: node scripts/e2e-clean.js --fast --skip-gates

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: /tmp/gfp-e2e/*.log
          if-no-files-found: ignore

  dependency-audit:
    name: Dependency Audit (prod, high+)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: npm audit (production deps, high+ fails unless allowlisted)
        run: npm run audit:prod

      - name: Full audit report (informational, never fails)
        if: always()
        run: npm audit || true

  # ── SDK PIN INTEGRITY ─────────────────────────────────────────────────────
  # Fails when a manifest pin or an installed version has drifted away from the
  # version Expo SDK 57 actually targets, or away from the Node/React version
  # this repo runs. Targets are fetched live from api.expo.dev, so this needs no
  # hand-maintained table and cannot go stale.
  #
  # This exists because the weekly dependency routine twice bumped an
  # SDK-managed package to npm's `latest` (react-native 0.87 in PR #40, react
  # 19.3.0 in PR #64). Both passed lint, type-check and tests — no peer range in
  # the tree is tight enough to catch it — so only an explicit check does.
  #
  # Degrades to a pass with a warning if api.expo.dev is unreachable, so a
  # network blip never fails the build.
  dependency-pins:
    name: SDK Pin Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Assert SDK-managed and runtime-tracked pins
        run: npm run check-updates -- --assert-pins

  # ── REQUIRED STATUS CHECK GATE ──────────────────────────────────────────
  # This job runs only after both above jobs succeed.
  # GitHub branch protection can require THIS single job instead of
  # tracking each individual job, which simplifies the branch protection config.
  all-checks-passed:
    name: All CI Checks Passed
    runs-on: ubuntu-latest
    needs: [typescript-checks, dotnet-build, web-bundles, e2e, dependency-audit, dependency-pins]
    if: always()

    steps:
      - name: Check all jobs succeeded
        # If any upstream job failed or was cancelled, fail this job too.
        # This provides a single required status check for branch protection.
        run: |
          if [[ "${{ needs.dependency-pins.result }}" != "success" ]]; then
            echo "SDK pin integrity check failed"
            exit 1
          fi
          if [[ "${{ needs.typescript-checks.result }}" != "success" ]]; then
            echo "TypeScript checks failed"
            exit 1
          fi
          if [[ "${{ needs.dotnet-build.result }}" != "success" ]]; then
            echo ".NET build failed"
            exit 1
          fi
          if [[ "${{ needs.web-bundles.result }}" != "success" ]]; then
            echo "Web bundle export failed (admin or mobile)"
            exit 1
          fi
          if [[ "${{ needs.e2e.result }}" != "success" ]]; then
            echo "End-to-end harness failed (see the e2e-logs artifact)"
            exit 1
          fi
          if [[ "${{ needs.dependency-audit.result }}" != "success" ]]; then
            echo "Dependency audit failed (high/critical in production deps)"
            exit 1
          fi
          echo "All CI checks passed ✓"
